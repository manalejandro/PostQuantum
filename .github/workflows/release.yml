name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish (for example v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Sign, publish to Maven Central and create the GitHub release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          if [[ -z "$tag" ]]; then
            echo "::error::No tag supplied. Push a v* tag or pass the tag input."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check tag matches the project version
        shell: bash
        run: |
          set -euo pipefail
          version="$(./mvnw -B --no-transfer-progress -q help:evaluate -Dexpression=project.version -DforceStdout)"
          expected="v${version}"
          actual="${{ steps.meta.outputs.tag }}"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Tag $actual does not match the Maven version. Expected $expected."
            exit 1
          fi
          echo "Releasing $actual"

      - name: Import the release signing key
        id: signing
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$GPG_PRIVATE_KEY" ]]; then
            echo "::error::The GPG_PRIVATE_KEY secret is not configured."
            exit 1
          fi
          install -m 700 -d "$HOME/.gnupg"
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          fingerprint="$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')"
          if [[ -z "$fingerprint" ]]; then
            echo "::error::No secret key was imported from GPG_PRIVATE_KEY."
            exit 1
          fi
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "Signing with $fingerprint"

      - name: Configure the Maven Central credentials
        shell: bash
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$CENTRAL_USERNAME" || -z "$CENTRAL_PASSWORD" ]]; then
            echo "::error::The CENTRAL_USERNAME and CENTRAL_PASSWORD secrets are not configured."
            exit 1
          fi
          install -m 700 -d "$HOME/.m2"
          cat > "$HOME/.m2/settings.xml" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <settings xmlns="http://maven.apache.org/SETTINGS/1.2.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.2.0 https://maven.apache.org/xsd/settings-1.2.0.xsd">
            <servers>
              <server>
                <id>central</id>
                <username>${CENTRAL_USERNAME}</username>
                <password>${CENTRAL_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          EOF
          chmod 600 "$HOME/.m2/settings.xml"

      - name: Build, sign and publish to Maven Central
        shell: bash
        env:
          # Empty when the signing key has no passphrase, which is the normal case here.
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          ./mvnw -B --no-transfer-progress -Pcentral clean deploy \
            -Dgpg.keyname="${{ steps.signing.outputs.fingerprint }}"

      - name: Generate checksums
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          sha256sum postquantum-*.jar postquantum-*.pom > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.TOKEN }}
          tag_name: ${{ steps.meta.outputs.tag }}
          name: PostQuantum ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(steps.meta.outputs.tag, '-') }}
          files: |
            target/postquantum-*.jar
            target/postquantum-*.pom
            target/postquantum-*.asc
            target/SHA256SUMS
